<svg viewBox="0 0 680 660" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>最近一单：运输异常完整流程图（现场调研任务一）</title>
  <desc>六个环节的接手人、所用系统与误工点，依据 logistics 证据编号标注</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="40" y="46" font-size="15" fill="#2C2C2A">最近一单：客户改地址 + GPS 弱网（运单 YC-2026****，脱敏）</text>
  <text class="ts" x="40" y="66" font-size="12" fill="#888780">主线 = 谁接手 / 用什么系统 ｜ 右侧红色 = 哪里误工 ｜ 编号 = 证据来源</text>

  <g class="c-teal">
    <rect x="60" y="88" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="108" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">① 司机 · 发现异常</text>
    <text class="ts" x="210" y="127" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">微信群一句话：「堵了，进不去」</text>

    <rect x="60" y="178" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="198" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">② 林亦舟 · 调度确认与升级</text>
    <text class="ts" x="210" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">TMS 查单 + 微信群 + 电话</text>

    <rect x="60" y="268" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="288" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">③ 林亦舟 → 承运商司机</text>
    <text class="ts" x="210" y="307" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">电话 / 微信群传话</text>

    <rect x="60" y="358" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="378" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">④ 唐映秋 · 客服答复客户</text>
    <text class="ts" x="210" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">TMS 核对订单 + 找调度确认 ETA</text>

    <rect x="60" y="448" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="468" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">⑤ 唐映秋 · 结果确认</text>
    <text class="ts" x="210" y="487" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">未确认结果不覆盖原记录</text>

    <rect x="60" y="538" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="210" y="558" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">⑥ 顾明岚 · 事后复盘</text>
    <text class="ts" x="210" y="577" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">每周复盘会，复盘后才更新规则</text>
  </g>

  <path class="arr" d="M210 144 L210 176" fill="none" stroke="#5F5E5A" marker-end="url(#arrow)"/>
  <path class="arr" d="M210 234 L210 266" fill="none" stroke="#5F5E5A" marker-end="url(#arrow)"/>
  <path class="arr" d="M210 324 L210 356" fill="none" stroke="#5F5E5A" marker-end="url(#arrow)"/>
  <path class="arr" d="M210 414 L210 446" fill="none" stroke="#5F5E5A" marker-end="url(#arrow)"/>
  <path class="arr" d="M210 504 L210 536" fill="none" stroke="#5F5E5A" marker-end="url(#arrow)"/>

  <g class="c-red">
    <line x1="360" y1="116" x2="418" y2="116" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="88" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="107" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">信息不全</text>
    <text class="ts" x="530" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">没说排队还是封路（f11、f14）</text>

    <line x1="360" y1="206" x2="418" y2="206" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="178" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">反复人工查</text>
    <text class="ts" x="530" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">查 TMS、翻群消息（f12）</text>

    <line x1="360" y1="296" x2="418" y2="296" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="268" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">交接靠传话</text>
    <text class="ts" x="530" y="306" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">微信群交接经常漏（f01）</text>

    <line x1="360" y1="386" x2="418" y2="386" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="358" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="377" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">多一轮 + 丢字段</text>
    <text class="ts" x="530" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">先核订单再问调度（f20）；只改状态丢信息（f25）</text>

    <line x1="360" y1="476" x2="418" y2="476" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="448" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="467" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">全靠人工复核</text>
    <text class="ts" x="530" y="486" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">逐条核对，不能覆盖（f15、f34）</text>

    <line x1="360" y1="566" x2="418" y2="566" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="420" y="538" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="530" y="557" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">规则更新滞后</text>
    <text class="ts" x="530" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">复盘复测后才改规则（f55）</text>
  </g>

  <text class="ts" x="40" y="632" font-size="12" fill="#888780">误工点全部来自访谈证据，合成场景待验证；异常分支路径（人工接管 / 停止自动建议 / 接口故障）见任务二交付物</text>
</svg>
